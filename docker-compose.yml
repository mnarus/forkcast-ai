services:
  postgres:
    image: postgres:16
    container_name: forkcast-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: forkcast_ai
      POSTGRES_USER: forkcast
      POSTGRES_PASSWORD: forkcast
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
